name: package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -e ".[dev,packaging]"
      - run: pytest tests/test_m9b_packaging.py tests/test_persistence.py
      - run: python packaging/build.py
      - name: Internal packaged smoke check
        shell: pwsh
        run: |
          $env:FLOWTRACK_PACKAGING_SMOKE_TEST = "1"
          & dist/FlowTrack/FlowTrack.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GUI startup smoke check
        shell: pwsh
        run: |
          $env:FLOWTRACK_PACKAGING_GUI_SMOKE_TEST = "1"
          & dist/FlowTrack/FlowTrack.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/FlowTrack/FlowTrack.exe)) { throw "FlowTrack.exe missing" }
          if (-not [Environment]::Is64BitOperatingSystem) { throw "x64 runner required" }
          Get-Item dist/FlowTrack/FlowTrack.exe | Format-List Name,Length,VersionInfo
      - uses: actions/upload-artifact@v4
        with:
          name: FlowTrack-Windows-x64
          path: dist/FlowTrack
          if-no-files-found: error

  macos:
    # Intel runner plus Python.org universal2 Python; runner architecture alone is
    # not used as evidence that the application is universal2.
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Python.org universal2 Python 3.12.10
        run: |
          curl --fail --location --retry 3 --output python.pkg \
            https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -c \
            'import platform, sys; assert sys.version_info[:2] == (3, 12); print(platform.platform())'
      - name: Install build dependencies
        run: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pip install -e ".[dev,packaging]"
      - name: Pre-build validation
        run: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pytest tests/test_m9b_packaging.py tests/test_persistence.py
      - name: Build universal2 application
        run: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 packaging/build.py
      - name: Internal packaged smoke check
        run: FLOWTRACK_PACKAGING_SMOKE_TEST=1 dist/FlowTrack.app/Contents/MacOS/FlowTrack
      - name: GUI startup smoke check
        run: FLOWTRACK_PACKAGING_GUI_SMOKE_TEST=1 dist/FlowTrack.app/Contents/MacOS/FlowTrack
      - name: Verify architecture and deployment metadata
        run: |
          test -d dist/FlowTrack.app
          ARCHS="$(lipo -archs dist/FlowTrack.app/Contents/MacOS/FlowTrack)"
          echo "FlowTrack executable architectures: $ARCHS"
          grep -qw x86_64 <<< "$ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          file dist/FlowTrack.app/Contents/MacOS/FlowTrack
          otool -l dist/FlowTrack.app/Contents/MacOS/FlowTrack | grep -A5 LC_BUILD_VERSION
          plutil -p dist/FlowTrack.app/Contents/Info.plist
      - name: Preserve app bundle links
        run: ditto -c -k --sequesterRsrc --keepParent dist/FlowTrack.app dist/FlowTrack-macOS-universal2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FlowTrack-macOS-universal2
          path: dist/FlowTrack-macOS-universal2.zip
          if-no-files-found: error
